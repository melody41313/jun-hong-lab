  </div>

<section class="section">
  <div class="container">
    <div class="contact-panel">
      <h2>需求表單</h2>

      <form action="https://formsubmit.co/coleman50960019@gmail.com" method="POST" class="real-contact-form">
        <input type="hidden" name="_subject" value="【汫鈜網站】收到新的客製化需求">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">

        <div class="form-grid">
          <label>
            聯絡人／單位名稱 <span>*</span>
            <input type="text" name="聯絡人／單位名稱" required>
          </label>

          <label>
            聯絡電話
            <input type="tel" name="聯絡電話">
          </label>

          <label>
            Email <span>*</span>
            <input type="email" name="Email" required>
          </label>

          <label class="wide">
            諮詢需求 <span>*</span>
            <select name="諮詢需求" required>
              <option value="">請下拉選擇問題需求</option>
              <option>實驗室規劃（等相關問題）</option>
              <option>設備訂製（等相關問題）</option>
              <option>實驗室耗材訂購（等相關問題）</option>
              <option>其他需求</option>
            </select>
          </label>

          <label class="wide">
            可簡述相關需求（選填）
            <textarea name="需求內容" rows="6" placeholder="請簡單描述您的需求"></textarea>
          </label>
        </div>

        <button class="submit-btn" type="submit">立即送出 → 專人回覆</button>
      </form>
    </div>
  </div>
